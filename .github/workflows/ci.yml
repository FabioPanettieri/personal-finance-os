name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # PostgreSQL 16 è preinstallato sui runner ubuntu-24.04.
      - run: npm run test:db
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
      # Build senza variabili Supabase: verifica che l'app compili "non configurata".
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Percorso completo contro lo stack Supabase locale (Docker sul runner):
  # migration reali, tipi generati, RLS via SQL e via API, E2E con login e TOTP veri.
  supabase-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - name: Tipi generati allineati al database
        run: |
          npm run db:types
          git diff --exit-code -- types/database.ts
      - run: npm run test:db:supabase
      - run: npm run test:integration
      - run: npm run test:backup
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:local
      - if: always()
        run: npm run db:stop
