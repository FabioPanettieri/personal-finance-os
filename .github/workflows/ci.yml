name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # PostgreSQL 16 è preinstallato sui runner ubuntu-24.04.
      - run: npm run test:db
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
      # Build senza variabili Supabase: verifica che l'app compili "non configurata".
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
