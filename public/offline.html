<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0f" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
    <title>Finanze non raggiungibile</title>
    <style>
      :root {
        color-scheme: dark;
        --canvas: #0a0b0f;
        --surface: #13151b;
        --line: #252935;
        --fg: #f3f4f6;
        --muted: #9aa1ae;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--canvas);
        color: var(--fg);
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 28px 24px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--surface);
      }
      .badge {
        width: 48px;
        height: 48px;
        border-radius: 999px;
        background: linear-gradient(135deg, #9f53f0, #e2560a 55%, #2ca0d4);
      }
      h1 { margin: 18px 0 6px; font-size: 22px; letter-spacing: -0.02em; }
      p { margin: 0 0 12px; color: var(--muted); }
      ol { margin: 0 0 20px; padding-left: 20px; color: var(--muted); }
      li { margin-bottom: 6px; }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 0 22px;
        border-radius: 999px;
        background: var(--fg);
        color: var(--canvas);
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible { outline: 2px solid #9f53f0; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="badge" aria-hidden="true"></div>
      <h1>Finanze non è raggiungibile</h1>
      <p>I tuoi dati restano solo sul PC, quindi l’app funziona quando il PC è acceso. Controlla che:</p>
      <ol>
        <li>il PC sia acceso e con Finanze avviato;</li>
        <li>Tailscale sia attivo su questo dispositivo;</li>
        <li>ci sia connessione a Internet.</li>
      </ol>
      <a href="/">Riprova</a>
    </main>
  </body>
</html>
